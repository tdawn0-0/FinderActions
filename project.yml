name: FinderActions
options:
  bundleIdPrefix: com.finderactions
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

packages:
  FinderActionsCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      GCC_TREAT_WARNINGS_AS_ERRORS: YES
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  FinderActions:
    type: application
    platform: macOS
    sources:
      - path: Apps/Host/Sources
      - path: Apps/Host/Resources/Localizable.xcstrings
      - path: Apps/Host/Resources/Assets.xcassets
      - path: BundledActions
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finderactions.host
        PRODUCT_NAME: FinderActions
        INFOPLIST_FILE: Apps/Host/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/Host/Resources/FinderActions.entitlements
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        GENERATE_INFOPLIST_FILE: NO
        # Developer ID distribution: intentionally non-sandboxed.
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: FinderActionsCore
        product: FinderActionsCore
      - target: FAFinderSync
        embed: true
        codeSign: true
    scheme:
      testTargets: []

  # Module name must NOT be "FinderSync" (clashes with Apple's FinderSync.framework).
  FAFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/FinderSync
        excludes:
          - main.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finderactions.host.FinderSync
        PRODUCT_NAME: FAFinderSync
        PRODUCT_MODULE_NAME: FAFinderSync
        INFOPLIST_FILE: Extensions/FinderSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/FinderSync/FinderSync.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: FinderActionsCore
        product: FinderActionsCore
      - sdk: FinderSync.framework
      - sdk: Cocoa.framework

schemes:
  FinderActions:
    build:
      targets:
        FinderActions: all
        FAFinderSync: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
