name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Hermetic DMG release gates
        run: bash Scripts/test-dmg-release.sh

      - name: Swift package tests
        run: ./Scripts/test.sh

      # Keep product build descriptions separate from swift test on hosted toolchains.
      - name: Build all package products
        run: swift build --package-path . --scratch-path build/SwiftPMProducts

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Debug app build + Host dependency boundary
        run: ./Scripts/dev.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint website
        run: npm run lint
      - name: Check release links
        run: npm run check:release-links
      - name: Typecheck and build website
        run: npm run build
